name: keep-warm
# Pings the Render free-tier service every 10 minutes so the first visitor does not wait for a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://surakshasathi-l6tj.onrender.com/health
